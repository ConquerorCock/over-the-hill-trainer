game:
  process_name: "OverTheHill.exe"
  signatures_path: "trainer/signatures/base.yaml"
  tick_ms: 16

aim:
  enabled: true
  fov_degrees: 8.0
  smoothing: 0.35
  target_bone: "head"

esp:
  enabled: true
  box: true
  health_bar: true
  max_distance_m: 250
  color: "#00ff88"

recoil:
  enabled: true
  pattern: "auto"
  strength: 0.75

overlay:
  enabled: true
  fullscreen: true
  click_through: true
  fps_cap: 0

hotkeys:
  aim_toggle: "f1"
  esp_toggle: "f2"
  recoil_toggle: "f3"
  panic: "f12"

logging:
  level: "INFO"