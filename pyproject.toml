[project]
name = "over-the-hill-trainer"
version = "0.9.4"
description = "A Windows desktop trainer for the aging gamer — aim assist, ESP, recoil control, and stamina tweaks."
authors = [{ name = "over-the-hill-trainer maintainers", email = "maint@overthehilltrainer.dev" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
oth-trainer = "trainer.bootstrap:main"
oth-diag = "trainer.diagnostics:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"